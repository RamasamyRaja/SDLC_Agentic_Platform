services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_password}
      POSTGRES_DB: ${POSTGRES_DB:-ai_swe_agent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_user} -d ${POSTGRES_DB:-ai_swe_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside docker-compose, the backend must reach postgres via the
      # service name, not `localhost`.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Matches the workspace directory created (and owned by appuser) in
      # the Dockerfile, backed by a named volume so cloned repositories
      # survive container restarts.
      WORKSPACE_ROOT: /workspaces
      # Milvus Lite (embedded, file-backed — see app/retrieval/milvus_client.py
      # for why this environment uses Lite rather than a separate Milvus
      # server) needs its own persistent path, backed by a named volume so
      # the vector index survives container restarts. To point at a real
      # standalone/cluster Milvus instead, set MILVUS_MODE=server and
      # MILVUS_HOST/MILVUS_PORT in .env, and add a milvus service here.
      MILVUS_MODE: lite
      MILVUS_LITE_PATH: /milvus-data/milvus_lite.db
      SANDBOX_WORKSPACE_VOLUME: rad_ai_agent_workspaces
      SANDBOX_DOCKER_SOCKET: unix:///var/run/docker.sock
      # MISTRAL_API_KEY / MISTRAL_MODEL / MISTRAL_BASE_URL and the other
      # LLM_* settings are picked up automatically from `env_file: .env`
      # above — nothing else to configure here. Leaving MISTRAL_API_KEY
      # unset is fine; POST /api/tasks/{id}/analyze will return a clean
      # 502 rather than the app failing to start.
    ports:
      - "8000:8000"
    volumes:
      - workspaces:/workspaces
      - milvus_data:/milvus-data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
  workspaces:
    name: rad_ai_agent_workspaces
  milvus_data:
    name: rad_ai_agent_milvus_data
