<div class="page-container"><app-page-header title="Code Explorer" description="Browse repository structure and inspect source context."><a actions class="button" [routerLink]="['/app/repositories',repoId()]">Repository</a><a actions class="button" [routerLink]="['/app/repositories',repoId(),'analysis']">Analysis</a></app-page-header><div class="explorer"><aside class="tree card"><div class="tree-title">FILES</div>@for(d of docs();track d.path){<button class="tree-item" [class.active]="selected()===d.path" (click)="d.type==='file'&&open(d.path)"><span>{{d.type==='directory'?'▾':'·'}}</span><span>{{d.path}}</span></button>}</aside><main class="code card">@if(file();as f){<div class="code-head"><span class="mono">{{f.path}}</span><span class="muted">{{f.language}} · {{f.lines}} lines · {{f.size}} bytes @if(f.isMock){· mock preview}</span></div><app-code-viewer [content]="f.content" [language]="f.language"/>} @else {<div class="empty">{{loading()?'Loading repository…':'Select a file to inspect.'}}</div>}</main></div></div>
