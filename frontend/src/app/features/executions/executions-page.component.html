<div class="page-container"><app-page-header title="Executions" description="Review agent run history, sandbox activity, and outcomes."/><div class="toolbar"><select class="input" (change)="setFilter($event)"><option value="all">All executions</option><option>running</option><option>success</option><option>failed</option><option>timeout</option><option>pending</option></select></div><div class="data-panel"><table class="data-table"><thead><tr><th>Execution</th><th>Task</th><th>Status</th><th>Duration</th><th>Sandbox</th><th>Started</th></tr></thead><tbody>@if(loading()){<tr><td colspan="6">Loading executions…</td></tr>}@for(e of filtered();track e.id){<tr><td><a class="table-link mono" [routerLink]="['/app/executions',e.task_id,e.id]">{{e.id}}</a></td><td>{{e.task_title||e.task_id}}</td><td><app-status-badge [status]="e.status"/></td><td class="mono">{{duration(e.duration_ms)}}</td><td>{{e.sandbox_status||'—'}}</td><td class="muted">{{time(e.started_at)}}</td></tr>}</tbody></table></div></div>
