<div class="page-container"><app-page-header title="Reports" description="Engineering summaries generated from tasks, repository context, and executions."/><div class="data-panel"><table class="data-table"><thead><tr><th>Report</th><th>Repository</th><th>Status</th><th>Generated</th><th>Outcome</th></tr></thead><tbody>@if(loading()){<tr><td colspan="5">Loading reports…</td></tr>}@for(r of reports();track r.id){<tr><td><a class="table-link" [routerLink]="['/app/reports',r.id]">{{r.taskTitle}}</a><div class="cell-sub">{{r.id}}</div></td><td>{{r.repositoryName}}</td><td><app-status-badge [status]="r.status"/></td><td class="muted">{{time(r.generatedAt)}}</td><td>{{r.finalOutcome}}</td></tr>}</tbody></table></div></div>
